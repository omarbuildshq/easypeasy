<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EasyPeasy — Streaming Setup Made Easy</title>
  <meta name="description" content="Set up Stremio or Nuvio in one click. No experience needed." />
  <link rel="stylesheet" href="/src/styles/global.css" />
  <link rel="stylesheet" href="/src/styles/components.css" />
  <link rel="stylesheet" href="/src/styles/animations.css" />
</head>
<body>
  <div class="app">
    <header class="hero">
      <div class="hero-content">
        <h1 class="hero-title">Easy<span class="accent">Peasy</span></h1>
        <p class="hero-subtitle">Streaming setup made easy</p>
        <p class="hero-desc">Set up Stremio or Nuvio with one click. No experience needed.</p>
      </div>
    </header>

    <main class="tools-grid">
      <a href="/src/quickstart/" class="tool-card">
        <div class="tool-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
          </svg>
        </div>
        <h2 class="tool-name">QuickStart</h2>
        <p class="tool-desc">Set up your streaming in one go</p>
        <span class="tool-arrow">&rarr;</span>
      </a>

      <a href="/src/addon-butler/" class="tool-card">
        <div class="tool-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="8" y1="6" x2="21" y2="6"></line>
            <line x1="8" y1="12" x2="21" y2="12"></line>
            <line x1="8" y1="18" x2="21" y2="18"></line>
            <line x1="3" y1="6" x2="3.01" y2="6"></line>
            <line x1="3" y1="12" x2="3.01" y2="12"></line>
            <line x1="3" y1="18" x2="3.01" y2="18"></line>
          </svg>
        </div>
        <h2 class="tool-name">Addon Butler</h2>
        <p class="tool-desc">Reorder and manage your addons</p>
        <span class="tool-arrow">&rarr;</span>
      </a>

      <a href="/src/cine-patch/" class="tool-card">
        <div class="tool-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="2" width="20" height="20" rx="2.18" ry="2.18"></rect>
            <line x1="7" y1="2" x2="7" y2="22"></line>
            <line x1="17" y1="2" x2="17" y2="22"></line>
            <line x1="2" y1="12" x2="22" y2="12"></line>
            <line x1="2" y1="7" x2="7" y2="7"></line>
            <line x1="2" y1="17" x2="7" y2="17"></line>
            <line x1="17" y1="7" x2="22" y2="7"></line>
            <line x1="17" y1="17" x2="22" y2="17"></line>
          </svg>
        </div>
        <h2 class="tool-name">CinePatch</h2>
        <p class="tool-desc">Customize your Cinemeta addon</p>
        <span class="tool-arrow">&rarr;</span>
      </a>
    </main>

    <footer class="footer">
      <p>EasyPeasy &mdash; streaming doesn't have to be hard.</p>
    </footer>
  </div>
</body>
</html>
